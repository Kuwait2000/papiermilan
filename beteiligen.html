  /* ---------- Kontakte und Projekte als Liste ----------
     Frueher je drei Karten mit umrandetem Knopf. Seit der Designrunde

  .kontakt-liste, .projekt-liste {
    margin: 1.25rem 0 1.25rem; border-top: 2px solid var(--text);
  }
  .kontakt-karte, .projekt-karte {
    display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: .2rem 1.5rem;
    padding: 1rem 0 1.05rem; border-bottom: 1px solid var(--border);
  }
  .kontakt-karte h3, .projekt-karte h3 { grid-row: 1 / span 2; color: var(--primary); margin: 0; line-height: 1.3; }
  .kontakt-karte p, .projekt-karte p { font-size: .92rem; color: var(--text-muted); margin: 0; }
  .kontakt-link, .projekt-link {
    justify-self: start; font-size: .88rem; font-weight: 600; color: var(--accent);
    text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px;
  }
  .kontakt-link:hover, .projekt-link:hover { text-decoration-thickness: 2px; }
  .projekt-karte code { font-size: .8rem; background: var(--bg-warm); padding: .05rem .3rem; border-radius: 4px; white-space: nowrap; }
  .klein-hinweis { font-size: .82rem; color: var(--text-faint); max-width: 68ch; }
  .kontakt-link::after, .projekt-link::after { content: ' ↗'; opacity: .7; font-size: .9em; }
  @media (max-width: 640px) {
    .kontakt-karte, .projekt-karte { grid-template-columns: minmax(0, 1fr); gap: .35rem; }
    .kontakt-karte h3, .projekt-karte h3 { grid-row: auto; }
  }

  .portal-cta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
    background: var(--bg-warm); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.1rem 1.3rem; margin-bottom: 1rem;
  }
  .portal-cta p { margin: 0; flex: 1; min-width: 220px; font-size: .95rem; color: var(--text-muted); }
  .btn-portal {
    display: inline-block; flex: none; font-size: .88rem; font-weight: 600; text-decoration: none;
    color: #fff; background: var(--primary); border-radius: 999px; padding: .55rem 1.2rem;
  }
  .btn-portal:hover { background: var(--primary-dark); }
  /* schmale Handys (320 px): lange Knoepfe und Code-Beispiele umbrechen */

  @media (max-width: 380px) { .projekt-karte code { white-space: normal; overflow-wrap: anywhere; } }
  .btn-portal::after { content: ' ↗'; opacity: .8; font-size: .9em; }
