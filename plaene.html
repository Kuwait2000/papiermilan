  var leicht = false;
  try { leicht = localStorage.getItem(LS_KEY_LEICHT) === "1"; } catch (err) { /* Storage kann gesperrt sein */ }
  function t(n, l) { return leicht ? l : n; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function lnk(url, inhalt) {
    return "<a href=\"" + esc(url) + "\" rel=\"noopener noreferrer\" target=\"_blank\">" + inhalt +
      "<span class=\"sr-only\"> (öffnet in neuem Tab)</span></a>";
  }
  function datumDE(iso) {
    if (!iso) return "";
    var p = iso.split("-");
    return p[2] + "." + p[1] + "." + p[0];
  }
  function monatDE(iso) {
    var m = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    var p = iso.split("-");
    return m[+p[1] - 1] + " " + p[0];
  }
  var ALT_AB = D.zeitraum.alle_gremien_ab + "-01";

  /* ---------------- Verfahrensschritte ---------------- */
  var SCHRITT = {
    grundsatz: { n: "Grundsatzbeschluss", l: "Erste Entscheidung", farbe: "var(--s-grundsatz)" },
    aufstellung: { n: "Aufstellung beschlossen", l: "Plan wird gemacht", farbe: "var(--s-aufstellung)" },
    entwurf: { n: "Entwurf genehmigt", l: "Entwurf ist fertig", farbe: "var(--s-entwurf)" },
    satzung: { n: "Beschlossen, noch nicht in Kraft", l: "Beschlossen, gilt noch nicht", farbe: "var(--s-satzung)" },
    kraft: { n: "In Kraft", l: "Plan gilt", farbe: "var(--s-kraft)" },
    offen: { n: "Stand offen", l: "Stand unbekannt", farbe: "var(--s-offen)" }
  };
  var SCHRITT_NAME = {
    grundsatz: ["Grundsatzbeschluss", "Erste Entscheidung"],
    aufstellung: ["Aufstellungsbeschluss", "Start vom Plan"],
    entwurf: ["Entwurfsgenehmigung", "Entwurf"],
    satzung: ["Satzungsbeschluss", "Beschluss vom Plan"],
    fnp: ["Flächennutzungsplan", "Großer Plan für die ganze Stadt"],
    vertrag: ["Vertrag mit dem Bauherrn", "Vertrag"],
    sonst: ["Weiterer Beschluss", "Anderer Beschluss"]
  };
  function standVon(p) { return p.status.schritt; }
  var LAND = t("Landesportal Bauleitpläne Bayern", "Internet-Seite vom Land Bayern");
  function wer(g) { return g === "Stadtrat" ? t("Der Stadtrat", "Der Stadt-Rat") : esc(g); }

  function standSatz(p) {
    var s = p.stand, st = p.status, sta = p.stationen;
    if (st.schritt === "kraft") {
      var satz = t("Dieser Plan gilt seit dem " + datumDE(st.datum) + ".", "Dieser Plan gilt seit dem " + datumDE(st.datum) + ".");
      if (sta.satzung) satz += t(" Als Satzung beschlossen wurde er am " + datumDE(sta.satzung.datum) + ".", " Beschlossen wurde er am " + datumDE(sta.satzung.datum) + ".");
      return satz + t(" Das Datum des Inkrafttretens stammt aus dem Landesportal Bauleitpläne Bayern, ohne Gewähr.", "");
    }
    if (!s) {
      if (st.quelle === "land" && st.schritt !== "offen") {
        return t("Laut Landesportal Bauleitpläne Bayern ist dieser Plan im Verfahren, Stand: " + SCHRITT_NAME[st.schritt][0] +
          (st.datum ? " vom " + datumDE(st.datum) : "") + ". Eine eigene Vorlage dazu gab es im Stadtrat im ausgewerteten Zeitraum nicht.",
          "Dieser Plan wird noch gemacht. Im Stadt-Rat war er zuletzt nicht.");
      }
      return t("Zu diesem Plan gibt es in den ausgewerteten Sitzungen keinen Verfahrensschritt, nur Beschlüsse rund um das Gebiet, zum Beispiel zur Erschließung. Im Landesportal ist er nicht verzeichnet.",
        "Zu diesem Plan haben wir keinen Schritt gefunden. Es gibt nur Beschlüsse zu dem Gebiet. Zum Beispiel zu den Straßen.");
    }
    var d = datumDE(s.datum), offen = !s.ergebnis;
    if (offen) {
      return t("Zuletzt stand am " + d + " dieser Schritt auf der Tagesordnung: " + SCHRITT_NAME[s.schritt][0] + " (" + esc(s.gremium) +
        "). Das Abstimmungsergebnis haben wir für diese Sitzung nicht ausgelesen.",
        "Am " + d + " ging es um diesen Schritt: " + SCHRITT_NAME[s.schritt][1] + ". Wie abgestimmt wurde, wissen wir nicht.");
    }
    if (s.ergebnis !== "beschlossen") {
      return t("Am " + d + " stand dieser Schritt zur Abstimmung: " + SCHRITT_NAME[s.schritt][0] + " (" + esc(s.gremium) + "). Ergebnis: " + esc(s.ergebnis) + ".",
        "Am " + d + " wurde über diesen Schritt abgestimmt: " + SCHRITT_NAME[s.schritt][1] + ". Ergebnis: " + esc(s.ergebnis) + ".");
    }
    if (s.schritt === "satzung") {
      if (!p.umgriff) {
        return t(wer(s.gremium) + " hat den Plan am " + d + " als Satzung beschlossen. Im Landesportal Bauleitpläne Bayern ist er unter dieser Nummer nicht verzeichnet; ob und seit wann er gilt, lässt sich hier nicht sagen.",
          wer(s.gremium) + " hat den Plan am " + d + " beschlossen. Ob er schon gilt, wissen wir nicht.");
      }
      return t(wer(s.gremium) + " hat den Plan am " + d + " als Satzung beschlossen. Gültig wird er erst, wenn die Stadt das im Amtsblatt bekannt macht. Im Landesportal Bauleitpläne Bayern ist er noch nicht als in Kraft getreten verzeichnet (abgerufen am " + datumDE(D.land.abgerufen_am) + ").",
        wer(s.gremium) + " hat den Plan am " + d + " beschlossen. Der Plan gilt erst, wenn die Stadt das im Amts-Blatt schreibt. Das ist wohl noch nicht passiert.");
    }
    if (s.schritt === "entwurf") {
      return t(wer(s.gremium) + " hat den Entwurf am " + d + " genehmigt" + (s.zusatz ? " (" + esc(s.zusatz) + ")" : "") +
        ". Danach wird der Entwurf öffentlich ausgelegt. In dieser Zeit kann jede und jeder Stellung nehmen.",
        wer(s.gremium) + " hat am " + d + " Ja zum Entwurf gesagt. Danach können alle den Entwurf ansehen. Und alle können ihre Meinung dazu schreiben.");
    }
    if (s.schritt === "aufstellung") {
      return t(wer(s.gremium) + " hat am " + d + " beschlossen, diesen Plan aufzustellen" + (s.zusatz ? " (" + esc(s.zusatz) + ")" : "") +
        ". Ein Entwurf liegt in den Ratsdaten noch nicht vor.",
        wer(s.gremium) + " hat am " + d + " beschlossen: Für dieses Gebiet soll es einen Plan geben. Einen Entwurf gibt es noch nicht.");
    }
    return t(wer(s.gremium) + " hat am " + d + " einen Grundsatzbeschluss gefasst. Das förmliche Verfahren hat damit noch nicht begonnen.",
      wer(s.gremium) + " hat am " + d + " eine erste Entscheidung getroffen. Der Plan selbst kommt später.");
  }

  /* Fünf Stationen. Die Auslegung steht in keiner der beiden Quellen, das Inkrafttreten nur beim Landesdienst. */
  function leiste(p) {
    var rang = { offen: -1, grundsatz: 0, aufstellung: 1, entwurf: 2, satzung: 3, kraft: 4 };
    var hoch = rang[standVon(p)], sta = p.stationen;
    function station(name, nameL, nr, schluessel, sonst) {
      var klasse = hoch > nr ? "fertig" : (hoch === nr ? "jetzt" : "");
      var d = sta[schluessel];
      var unter = d ? datumDE(d.datum) + (d.quelle === "land" && !leicht ? "<br>laut Landesportal" : "")
        : (hoch >= nr && nr < 4 ? t("Datum nicht in den Daten", "Datum unbekannt") : sonst || "");
      return "<li class=\"" + klasse + "\"><strong>" + t(name, nameL) + "</strong>" + unter + "</li>";
    }
    var html = "<ol class=\"leiste\" style=\"--s:" + SCHRITT[standVon(p)].farbe + "\">";
    html += station("Aufstellung", "Start", 1, "aufstellung", hoch === 0 ? t("noch nicht beschlossen", "noch nicht") : "");
    html += station("Entwurf", "Entwurf", 2, "entwurf", "");
    html += "<li class=\"" + (hoch >= 3 ? "fertig" : (hoch === 2 ? "unklar" : "")) + "\"><strong>" + t("Auslegung", "Alle dürfen mitreden") + "</strong>" +
      (hoch >= 3 ? t("abgeschlossen", "vorbei") : (hoch === 2 ? t("folgt auf den Entwurf, Termin im Amtsblatt", "kommt nach dem Entwurf") : "")) + "</li>";
    html += station("Satzung", "Beschluss", 3, "satzung", "");
    html += station("In Kraft", "Plan gilt", 4, "inkraft", hoch === 3 ? t("noch nicht verzeichnet", "noch nicht") : "");
    return html + "</ol>";
  }

  var FRAGEN = [
    ["begruendung", "Was ist geplant und warum?", "Was ist geplant?"],
    ["abwaegung", "Was wurde eingewendet, was sagt die Stadt dazu?", "Was sagen andere dazu?"],
    ["verkehr", "Verkehr und Parken", "Verkehr und Parken"],
    ["laerm", "Lärm und Luft", "Lärm und Luft"],
    ["natur", "Natur, Bäume, Tiere", "Natur, Bäume und Tiere"],
    ["boden", "Boden und Wasser", "Boden und Wasser"],
    ["klima", "Klima und Energie", "Klima und Energie"],
    ["fnp", "Flächennutzungsplan", "Großer Plan für die ganze Stadt"],
    ["vertrag", "Verträge", "Verträge"],
    ["sonst", "Weitere Anlagen", "Andere Papiere"]
  ];

  function steckbrief(p) {
    var st = standVon(p), s = SCHRITT[st];
    var d = document.createElement("details");
    d.className = "plan"; d.id = "plan-" + p.id; d.style.setProperty("--s", s.farbe);
    var titel = esc(p.kurz || p.name || t("Plan ohne Namen in den Daten", "Plan ohne Namen"));
    var meta = [t("Bebauungsplan Nr. ", "Plan Nummer ") + esc(p.nr)];
    if (p.kurz && p.name && p.kurz !== p.name) meta.push("„" + esc(p.name) + "“");
    meta.push(p.bezirk_name ? t("Bezirk ", "Bezirk ") + esc(p.bezirk_name) : t("Bezirk noch nicht zugeordnet", "Bezirk unbekannt"));
    if (p.status.datum) meta.push((st === "kraft" ? t("seit ", "seit ") : t("Stand ", "Stand ")) + datumDE(p.status.datum));
    var html = "<summary><span class=\"plan-name\">" + titel + "</span><span class=\"plan-meta\">" + meta.join(" · ") +
      "</span><span class=\"pille\">" + (st === "satzung" && !p.umgriff ? t("Als Satzung beschlossen", "Plan ist beschlossen") : t(s.n, s.l)) + "</span></summary><div class=\"plan-inhalt\">";

    html += "<p class=\"stand-satz\">" + standSatz(p) + "</p>";
    var hin = t(p.hinweis, p.hinweis_l || p.hinweis);
    if (hin) html += "<p>" + esc(hin) + "</p>";
    html += leiste(p);

    var txt = t(p.text.n, p.text.l || p.text.n);
    if (txt) {
      html += "<h3>" + t("Worum es geht", "Darum geht es") + "</h3><p>" + esc(txt) + "</p>";
    }

    // Planzeichnung
    html += "<h3>" + t("Der Plan selbst", "Der Plan") + "</h3>";
    var hatPlan = false, ratFassungen = p.zeichnungen;
    if (p.amt && p.amt.plan_url) {
      hatPlan = true;
      html += "<p><a class=\"zeichnung\" href=\"" + esc(p.amt.plan_url) + "\" rel=\"noopener noreferrer\" target=\"_blank\">" +
        t("Geltende Planzeichnung (PDF)", "Der Plan, der jetzt gilt (PDF)") + "<small>" +
        t("in Kraft seit " + datumDE(p.stationen.inkraft.datum) + ", Datei der Stadt, verlinkt im Landesportal", "Er gilt seit dem " + datumDE(p.stationen.inkraft.datum) + ".") +
        "</small></a></p>";
      if (p.amt.text_url) html += "<p class=\"klein\">" + lnk(p.amt.text_url, t("Textteil mit den Festsetzungen (PDF)", "Der Text zum Plan (PDF)")) + "</p>";
    } else if (ratFassungen.length) {
      hatPlan = true;
      var z = ratFassungen[0];
      ratFassungen.filter(function (x) { return x.vorlage === z.vorlage; }).forEach(function (x) {
        html += "<p><a class=\"zeichnung\" href=\"" + esc(x.url) + "\" rel=\"noopener noreferrer\" target=\"_blank\">" + esc(x.titel) +
          " (PDF)<small>" + t("Fassung " + (x.schritt === "entwurf" ? "zur " : "zum ") + SCHRITT_NAME[x.schritt][0] + " vom " + datumDE(x.datum) + ", im Ratsinfoportal",
            "Stand vom " + datumDE(x.datum) + ". Das Papier liegt bei der Stadt.") + "</small></a></p>";
      });
      ratFassungen = ratFassungen.filter(function (x) { return x.vorlage !== z.vorlage; });
    }
    if (ratFassungen.length) {
      html += "<p class=\"klein\">" + t(p.amt && p.amt.plan_url ? "Fassungen aus dem Stadtrat: " : "Ältere Fassungen: ", "Ältere Pläne: ") + ratFassungen.map(function (x) {
        return lnk(x.url, esc(x.titel) + " (" + SCHRITT_NAME[x.schritt][leicht ? 1 : 0] + ", " + datumDE(x.datum) + ")");
      }).join(" · ") + "</p>";
    }
    if (!hatPlan) {
      html += "<p class=\"klein\">" + t("Weder im Landesportal noch als eigene Anlage einer Vorlage ist eine Planzeichnung verlinkt. Sie kann in der Vorlage selbst stecken.",
        "Wir haben keinen Plan als eigenes Papier gefunden.") + "</p>";
    }

    // Unterlagen des letzten Verfahrensschritts nach Alltagsfragen
    var letzter = null;
    p.schritte.forEach(function (e) { if (p.stand && e.vorlage === p.stand.vorlage) letzter = e; });
    if (letzter) {
      var gruppen = "";
      FRAGEN.forEach(function (f) {
        var a = letzter.anlagen.filter(function (x) { return x.art === f[0]; });
        if (!a.length) return;
        gruppen += "<div><strong>" + t(f[1], f[2]) + "</strong><ul>" + a.map(function (x) {
          return "<li>" + lnk(x.url, esc(x.titel)) + "</li>";
        }).join("") + "</ul></div>";
      });
      if (gruppen) {
        html += "<h3>" + t("Unterlagen nach Fragen", "Papiere zum Plan") + "</h3><div class=\"fragen\">" + gruppen + "</div>" +
          "<p class=\"klein\" style=\"margin-top:.6rem\">" + t("Zugeordnet nach dem Titel der Anlage. ", "") +
          lnk(letzter.vorlage_url, t("Vorlage " + esc(letzter.vorlage) + " im Ratsinfoportal", "Alle Papiere bei der Stadt")) + "</p>";
      }
    }

    // Alle Schritte
    if (p.schritte.length) html += "<h3>" + t("Im Stadtrat und in den Ausschüssen", "Im Stadt-Rat") + "</h3><ul class=\"liste\">";
    else html += "<p class=\"klein\">" + t("Zu diesem Plan gab es im ausgewerteten Zeitraum keine Vorlage im Stadtrat. Die Angaben stammen aus dem Landesportal Bauleitpläne Bayern.", "Im Stadt-Rat war dieser Plan zuletzt nicht.") + "</p>";
    p.schritte.slice().reverse().forEach(function (e) {
      var erg = e.geplant ? "<span class=\"geplant\">" + t("geplant", "kommt noch") + "</span>"
        : (e.ergebnis ? esc(e.ergebnis) + (e.formel && !leicht ? " (" + esc(e.formel) + ")" : "") : t("Ergebnis nicht ausgelesen", "Ergebnis unbekannt"));
      html += "<li><time datetime=\"" + e.datum + "\">" + datumDE(e.datum) + "</time> · <strong>" + SCHRITT_NAME[e.schritt][leicht ? 1 : 0] +
        (e.zusatz && !leicht ? " (" + esc(e.zusatz) + ")" : "") + "</strong> · " + erg +
        "<br><span class=\"wer\">" + esc(e.gremium) + " · " + lnk(e.vorlage_url, esc(e.vorlage)) +
        (e.schritt === "sonst" || e.schritt === "fnp" || e.schritt === "vertrag" ? " · " + esc(e.titel) : "") + "</span></li>";
    });
    if (p.schritte.length) html += "</ul>";

    // Bezirksausschuss und andere Gremien
    if (p.dazu.length) {
      html += "<h3>" + t("Im Bezirksausschuss und anderen Gremien", "Im Bezirks-Ausschuss") + "</h3><ul class=\"liste\">";
      p.dazu.forEach(function (x) {
        html += "<li><time datetime=\"" + x.datum + "\">" + datumDE(x.datum) + "</time>" +
          (x.geplant ? " · <span class=\"geplant\">" + t("geplant", "kommt noch") + "</span>" : "") +
          " · " + lnk(x.url, esc(x.titel)) + "<br><span class=\"wer\">" + esc(x.gremium) +
          x.dokumente.map(function (dk) { return " · " + lnk(dk.url, esc(dk.titel)); }).join("") + "</span></li>";
      });
      html += "</ul>";
    }
    d.innerHTML = html + "</div>";
    return d;
  }

  /* ---------------- Filter und Liste ---------------- */
  var fBezirk = document.getElementById("f-bezirk"), fStand = document.getElementById("f-stand"), fSuche = document.getElementById("f-suche");
  var zeigeAlt = false;
  function option(sel, wert, text) { var o = document.createElement("option"); o.value = wert; o.textContent = text; sel.appendChild(o); }
  function baueFilter() {
    var b = fBezirk.value, s = fStand.value;
    fBezirk.textContent = ""; fStand.textContent = "";
    option(fBezirk, "", t("Ganz Ingolstadt", "Ganz Ingolstadt"));
    var namen = {};
    P.forEach(function (p) { if (p.bezirk) namen[p.bezirk] = p.bezirk_name; });
    Object.keys(namen).sort().forEach(function (nr) { option(fBezirk, nr, namen[nr]); });
    if (P.some(function (p) { return !p.bezirk; })) option(fBezirk, "-", t("Noch nicht zugeordnet", "Bezirk unbekannt"));
    option(fStand, "", t("Alle", "Alle"));
    option(fStand, "lauf", t("Im Verfahren", "Plan ist noch nicht fertig"));
    option(fStand, "satzung", t("Beschlossen, noch nicht in Kraft", "Beschlossen, gilt noch nicht"));
    option(fStand, "kraft", t("In Kraft", "Plan gilt"));
    fBezirk.value = b; fStand.value = s;
    fSuche.placeholder = t("z. B. Samhof oder 196", "zum Beispiel Samhof");
  }
  function passt(p) {
    if (fBezirk.value && (fBezirk.value === "-" ? p.bezirk : p.bezirk !== fBezirk.value)) return false;
    var st = standVon(p);
    if (fStand.value === "satzung" && st !== "satzung") return false;
    if (fStand.value === "kraft" && st !== "kraft") return false;
    if (fStand.value === "lauf" && (st === "satzung" || st === "offen" || st === "kraft")) return false;
    var q = fSuche.value.trim().toLowerCase();
    if (q) {
      var heu = ("nr. " + p.nr + " " + p.name + " " + p.kurz + " " + p.bezirk_name + " " + p.text.titel).toLowerCase();
      if (heu.indexOf(q) === -1) return false;
    }
    return true;
  }
  // Oben stehen Pläne im Verfahren und alles, was sich seit Beginn der Ratsdaten bewegt hat
  // Verfahren, die der Rat vor Jahren begonnen hat und die das Landesportal nicht kennt, stehen bei den älteren
  function istNeu(p) { return p.letzte_bewegung >= ALT_AB || (p.status.schritt !== "kraft" && p.umgriff); }
  function baueListe() {
    var liste = document.getElementById("liste"), mehr = document.getElementById("mehr");
    var offen = location.hash.indexOf("#plan-") === 0 ? location.hash.slice(1) : "";
    liste.textContent = "";
    var alle = P.filter(passt);
    var neu = alle.filter(istNeu);
    var alt = alle.filter(function (p) { return !istNeu(p); });
    var sucht = !!fSuche.value.trim() || fStand.value === "kraft";
    var zeige = (zeigeAlt || sucht || alt.some(function (p) { return "plan-" + p.id === offen; })) ? neu.concat(alt) : neu;
    zeige.forEach(function (p) {
      var d = steckbrief(p);
      if (d.id === offen) d.open = true;
      liste.appendChild(d);
    });
    document.getElementById("treffer").textContent = zeige.length === 1
      ? t("1 Plan", "1 Plan") : zeige.length + t(" Pläne", " Pläne") +
      (zeige.length < alle.length ? t(" im Verfahren oder mit Bewegung seit " + monatDE(ALT_AB) + ", dazu " + alt.length + " ältere Pläne", ". Dazu " + alt.length + " ältere Pläne") : "");
    mehr.hidden = !(alt.length && zeige.length < alle.length);
    mehr.textContent = t("Auch die " + alt.length + " älteren Pläne zeigen",
      "Auch " + alt.length + " ältere Pläne zeigen");
    if (!zeige.length) {
      liste.innerHTML = "<p class=\"klein\">" + t("Kein Plan passt zu dieser Auswahl.", "Dazu haben wir keinen Plan gefunden.") + "</p>";
    }
    if (offen) { var z = document.getElementById(offen); if (z) z.scrollIntoView(); }
  }
  [fBezirk, fStand].forEach(function (f) { f.addEventListener("change", baueListe); });
  fSuche.addEventListener("input", baueListe);
  document.getElementById("mehr").addEventListener("click", function () { zeigeAlt = true; baueListe(); });
  window.addEventListener("hashchange", function () { if (location.hash.indexOf("#plan-") === 0) baueListe(); });

  /* ---------------- Texte ---------------- */
  var nLauf = P.filter(function (p) { var s = standVon(p); return istNeu(p) && s !== "satzung" && s !== "offen" && s !== "kraft"; }).length;
  var nSatz = P.filter(function (p) { return istNeu(p) && standVon(p) === "satzung"; }).length;
  var nKraft = P.filter(function (p) { return standVon(p) === "kraft"; }).length;
  var nKraftNeu = P.filter(function (p) { return standVon(p) === "kraft" && p.status.datum >= ALT_AB; }).length;

  var TEXTE = {
    "hinweis": {
      n: "<strong>PapierPanther ist kein Angebot der Stadt Ingolstadt.</strong> " +
        "Die Angaben stammen aus dem öffentlichen Ratsinfoportal und dem Landesportal Bauleitpläne Bayern. Verbindlich sind allein die Pläne und Bekanntmachungen der Stadt. Dies ist ein Prototyp.",
      l: "<strong>PapierPanther ist kein Angebot der Stadt Ingolstadt.</strong> " +
        "Die Angaben kommen aus den Papieren vom Stadt-Rat. Es gilt nur, was die Stadt selbst schreibt. Die Seite ist noch ein Test."
    },
    "h1": { n: "Baugebiete und Pläne", l: "Bau-Gebiete und Pläne" },
    "lede": {
      n: "Wo in Ingolstadt neu gebaut werden darf, legt ein Bebauungsplan fest. Hier steht für jeden Plan, wie weit er ist und ob er schon gilt, mit dem direkten Weg zur Planzeichnung.",
      l: "Die Stadt macht Pläne für neue Bau-Gebiete. In so einem Plan steht: Was darf wo gebaut werden? Hier sehen Sie: Wie weit ist jeder Plan?"
    },
    "sprung-plaene": { n: "Alle Pläne", l: "Alle Pläne" },
