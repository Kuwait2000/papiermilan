<style>
  :root {
    /* Balken: Ingolstadt in Petrol, Vergleichsstaedte in Grau, der
       "sofort vermietbare" Teil des Leerstands in Ocker wie auf der Mieteseite. */
    --ingolstadt: #003e59;
    --vergleich: #b9b2a5;
    --leer: #d5e3e7;
    --marktaktiv: #b6752f;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 0 1.5rem; }

  h1 {
    font-family: var(--font-display); font-size: clamp(1.75rem, 4.5vw, 2.4rem);
    font-weight: 700; letter-spacing: -.02em; margin-bottom: .5rem;
    /* Ohne eigene Zeilenhoehe erbte die Ueberschrift 1.65 vom Fliesstext und
       zerfiel in zwei weit auseinanderstehende Zeilen. */
    line-height: 1.18; max-width: 30ch; text-wrap: balance;
  }
  .lede { color: var(--text-muted); font-size: 1.05rem; max-width: 62ch; margin-bottom: 1.75rem; }
  .sprungmarken { display: flex; flex-wrap: wrap; gap: .4rem; margin: -.75rem 0 1.75rem; }
  .sprungmarken a {
    font-size: .82rem; text-decoration: none; color: var(--primary-dark);
    border: 1px solid var(--border-strong); border-radius: 999px; padding: .2rem .75rem; background: var(--card);
  }
  .sprungmarken a:hover { background: var(--bg-warm); }

  .disclaimer {
    background: var(--warn-bg); border-bottom: 1px solid var(--warn-border);
    color: var(--warn-tx); font-size: .74rem; padding: .5rem 0;
  }
  .disclaimer p { max-width: 680px; }

  h2 {
    font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
    margin: 3rem 0 .75rem; letter-spacing: -.01em;
  }
  h3 { font-size: 1.05rem; font-weight: 700; margin: 2rem 0 .5rem; }
  p { margin-bottom: 1rem; max-width: 68ch; }

  .karte {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1.5rem 1.5rem 1.25rem; margin: 1.25rem 0 2rem;
    max-width: 100%;
  }
  .diagramm {
    /* Weisse Flaeche mit Linie oben wie eine Grafik in der Zeitung, ohne Rahmen
       und Schatten. Auf dem Papiergrau wirkten die Diagramme blass. */
    background: var(--card); border-top: 2px solid var(--text);
    padding: .9rem 1.25rem 1.1rem; margin: 1.5rem 0 2.25rem;
    max-width: 100%;
  }
  @media (max-width: 640px) { .karte { padding: 1.1rem 1rem 1rem; } }
  .diagramm-fuss { font-size: .78rem; color: var(--text-faint); margin-top: .9rem; margin-bottom: 0; }

  .kennzahlen {
    /* Zahlenleiste wie in der Zeitung statt einzelner Karten: Linie oben,
       feine Trennstriche zwischen den Zahlen (Designrunde 2026-10-26).
       overflow: hidden schneidet den linken Strich der ersten Spalte ab. */
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0; margin: 0 0 .5rem; border-top: 2px solid var(--text); overflow: hidden;
  }
  .kachel {
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
    margin-left: -1px; padding: .8rem 1rem .9rem;
    min-width: 0; overflow-wrap: break-word; hyphens: auto;
  }
  .kachel .kachel-wert {
    font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
    color: var(--text); line-height: 1.25; margin: .15rem 0 .3rem; white-space: nowrap;
  }
  .stichtag { font-size: .8rem; color: var(--text-faint); margin: .25rem 0 0; }
  @media (max-width: 480px) {
    .kennzahlen { grid-template-columns: 1fr 1fr; }
    .kachel { padding: .7rem .75rem .8rem; }
    .kachel .kachel-wert { font-size: 1.2rem; }
    .kachel-label, .kachel-unter { font-size: .74rem; }
  }

  /* ---------- Balken (HTML statt SVG, damit sie auf dem Handy umbrechen) ---------- */
  .balken { display: grid; gap: .55rem; --skala: .78; }
  .b-zeile { display: grid; grid-template-columns: minmax(8rem, 15rem) 1fr; gap: .2rem .9rem; align-items: center; }
  .b-label { font-size: .86rem; line-height: 1.35; }
  .b-zeile.betont .b-label { font-weight: 700; }
  .b-spuren { display: grid; gap: .2rem; }
  .b-spur { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .b-balken { height: 1.05rem; border-radius: 3px; background: var(--vergleich); flex: none; min-width: 2px; }
  .b-balken.ingolstadt { background: var(--ingolstadt); }
  .b-balken.leer { background: var(--leer); }
  .b-balken.marktaktiv { background: var(--marktaktiv); height: .7rem; }
  .b-zahl { font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; line-height: 1.3; }
  .b-zahl small { font-weight: 400; color: var(--text-faint); font-size: .76rem; }
  @media (max-width: 560px) {
    .b-zeile { grid-template-columns: 1fr; }
    .balken { --skala: .5; }
  }

  .kasten {
    background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--primary);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: .9rem 1.1rem; margin: 1.25rem 0 2rem; max-width: 68ch;
  }
  .kasten h3 { margin: 0 0 .35rem; font-size: 1rem; }
  .kasten p { font-size: .92rem; margin-bottom: .5rem; }
  .kasten p:last-child { margin-bottom: 0; }

  .weiter { font-size: .92rem; }

  .fehlt-liste { list-style: none; margin: .5rem 0 0; display: grid; gap: .5rem; }
  .fehlt-liste li {
    background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius);
    padding: .65rem .9rem; font-size: .9rem;
  }
  .fehlt-liste strong { font-weight: 600; }
  .fehlt-liste span { color: var(--text-muted); }

  .quellen ul { list-style: none; display: grid; gap: .25rem; margin-top: .5rem; }
  .stand { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--border-strong); }
  .ladehinweis { color: var(--text-faint); font-size: .9rem; }
  /* ---------- Baugebiete und Pläne ---------- */
  :root { --s-grundsatz: #7b7466; --s-aufstellung: #9a600c; --s-entwurf: #2f5f86; --s-satzung: #2f7a4a; --s-kraft: #14532d; --s-offen: #8f8779; }
  .filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .75rem 1rem; margin: 1.25rem 0 .75rem;
    background: var(--card); border-top: 2px solid var(--text); padding: .9rem 1.1rem 1rem; }
  .filter label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-muted); margin-bottom: .2rem; }
  .filter select, .filter input { font: inherit; font-size: .92rem; width: 100%; padding: .4rem .55rem; border: 1px solid var(--border-strong);
    border-radius: 6px; background: #fff; color: var(--text); }
  .treffer { font-size: .85rem; color: var(--text-faint); margin: 0 0 .75rem; }
  .plan { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--s); border-radius: 0 var(--radius) var(--radius) 0;
    box-shadow: var(--shadow); margin: 0 0 .7rem; }
  .plan > summary { list-style: none; cursor: pointer; padding: .8rem 1.1rem .85rem; display: grid; grid-template-columns: 1fr auto; gap: .15rem .9rem; align-items: start; }
  .plan > summary::-webkit-details-marker { display: none; }
  .plan > summary:hover { background: var(--bg-warm); }
  .plan-name { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; line-height: 1.3; }
  .plan-meta { font-size: .8rem; color: var(--text-faint); grid-column: 1; }
  .pille { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: .76rem; font-weight: 600; color: #fff; background: var(--s);
    border-radius: 999px; padding: .18rem .7rem; white-space: nowrap; }
  .plan-inhalt { padding: .2rem 1.1rem 1.2rem; border-top: 1px solid var(--border); }
  .plan-inhalt h3 { font-size: .95rem; margin: 1.4rem 0 .45rem; }
  .plan-inhalt p { font-size: .94rem; }
  .stand-satz { font-size: 1rem !important; font-weight: 600; margin-top: 1rem; }
  .zeichnung { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; font-size: .92rem;
    border-radius: 8px; padding: .55rem .95rem; margin: .1rem 0 .4rem; }
  .zeichnung:hover { background: var(--primary-dark); }
  .zeichnung small { display: block; font-weight: 400; font-size: .76rem; opacity: .85; }
  .klein { font-size: .82rem !important; color: var(--text-faint); }
  /* Verfahrensleiste: fünf Stationen auf einer Linie */
  .leiste { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); margin: .9rem 0 .3rem; }
  .leiste li { position: relative; padding: 1.35rem .3rem 0 0; font-size: .78rem; line-height: 1.35; color: var(--text-faint); }
  .leiste li::before { content: ""; position: absolute; top: .45rem; left: 0; right: 0; height: 2px; background: var(--border-strong); }
  .leiste li:last-child::before { right: auto; width: 0; }
  .leiste li::after { content: ""; position: absolute; top: 0; left: 0; width: .95rem; height: .95rem; border-radius: 50%; background: #fff;
    border: 2px solid var(--border-strong); box-sizing: border-box; }
  .leiste li strong { display: block; color: var(--text); font-size: .82rem; }
  .leiste li.fertig::after { background: var(--s); border-color: var(--s); }
  .leiste li.fertig::before { background: var(--s); }
  .leiste li.jetzt::after { background: var(--s); border-color: var(--s); box-shadow: 0 0 0 4px color-mix(in srgb, var(--s) 25%, transparent); }
  .leiste li.unklar::after { border-style: dashed; }
  .leiste li.unklar strong { color: var(--text-muted); }
  @media (max-width: 620px) {
    .leiste { grid-template-columns: 1fr; gap: .1rem; }
    .leiste li { padding: 0 0 .7rem 1.6rem; }
    .leiste li::before { top: .95rem; bottom: 0; left: .42rem; right: auto; width: 2px; height: auto; }
    .leiste li:last-child::before { width: 0; }
    .plan > summary { grid-template-columns: 1fr; }
    .pille { grid-row: auto; grid-column: 1; justify-self: start; margin-top: .3rem; }
  }
  .fragen { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .5rem 1.5rem; }
  .fragen div { font-size: .88rem; }
  .fragen strong { display: block; font-size: .82rem; color: var(--text-muted); margin-bottom: .1rem; }
  .fragen a, .liste a { color: var(--primary-dark); }
  .fragen ul, .liste { list-style: none; }
  .liste li { font-size: .88rem; padding: .35rem 0; border-top: 1px solid var(--border); }
  .liste li:first-child { border-top: 0; }
  .liste time, .liste .wer { color: var(--text-faint); font-size: .8rem; }
  .liste .geplant { font-weight: 600; color: var(--s-aufstellung); }
  .weg { list-style: none; counter-reset: weg; display: grid; gap: .6rem; margin: 1rem 0 1.5rem; max-width: 68ch; }
  .weg li { counter-increment: weg; position: relative; padding-left: 2.6rem; font-size: .94rem; }
  .weg li::before { content: counter(weg); position: absolute; left: 0; top: .05rem; width: 1.8rem; height: 1.8rem; border-radius: 50%;
    background: var(--primary); color: #fff; font-weight: 700; font-size: .9rem; display: grid; place-items: center; }
  .weg li strong { display: block; }
  .mehr-knopf { font: inherit; font-size: .9rem; cursor: pointer; background: var(--card); border: 1px solid var(--border-strong); border-radius: 999px;
    padding: .4rem 1rem; margin: .5rem 0 0; color: var(--primary-dark); }
  .mehr-knopf:hover { background: var(--bg-warm); }
</style>
